<!DOCTYPE html>

<html lang="en">

<head>

  <!-- ==========================================
       INFORMATIONS PRINCIPALES
  =========================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#01030c"
  >

  <meta
    name="description"
    content="The Sleeper — enter the Museum of Dreams."
  >

  <title>
    The Sleeper — Museum of Dreams
  </title>


  <!-- Polices -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Gloock&family=Italiana&display=swap"
    rel="stylesheet"
  >


  <!-- CSS de la page -->

  <link
    rel="stylesheet"
    href="./sleep.css?v=41"
  >

</head>


<body class="sleeper-page">


  <!-- ==========================================
       CIEL ANIMÉ
  =========================================== -->

  <div
    class="dream-sky"
    aria-hidden="true"
  >

    <div class="sky-gradient"></div>

    <div class="milky-way"></div>

    <div class="nebula nebula-one"></div>

    <div class="nebula nebula-two"></div>

    <canvas id="stars"></canvas>

  </div>


  <!-- ==========================================
       VISAGE DU DORMEUR
  =========================================== -->

  <div
    class="sleeper-portrait"
    aria-hidden="true"
  >

    <div class="head-aura"></div>


    <!-- État initial : yeux ouverts -->

    <img
      class="sleeper-face face-open"
      src="./sleeper-open.png"
      alt=""
    >


    <!-- État révélé : yeux fermés -->

    <img
      class="sleeper-face face-closed"
      src="./sleeper-closed.png"
      alt=""
    >

  </div>


  <!-- ==========================================
       ACTIVITÉ CÉRÉBRALE
  =========================================== -->

  <canvas
    id="brain"
    aria-hidden="true"
  ></canvas>


  <!-- ==========================================
       NAVIGATION
  =========================================== -->

  <header class="page-header">

    <a href="index.html">
      THE MUSEUM OF DREAMS
    </a>


    <div class="clock-wrapper">

      <span class="live-dot"></span>

      <span id="sleep-clock">
        23:47
      </span>

    </div>


    <a href="case-study.html">
      PROJECT
    </a>

  </header>


  <!-- ==========================================
       NARRATION

       Une seule phrase peut être visible.
  =========================================== -->

  <section
    class="narration-wrapper"
    aria-live="polite"
  >

    <p
      class="narration"
      id="narration"
    >
      When night <em>has fallen…</em>
    </p>

  </section>


  <!-- ==========================================
       RÉVÉLATION FINALE
  =========================================== -->

  <section
    class="final-revelation"
    id="final-revelation"
  >

    <p class="creation-line">
      it creates…
    </p>

    <h1>
      DREAMS
    </h1>

    <p class="museum-status">
      THE MUSEUM IS NOW OPEN
    </p>

    <a
      href="brain.html"
      class="enter-mind"
      id="enter-mind"
    >
      ENTER THE MIND
    </a>

  </section>


  <!-- ==========================================
       DONNÉES DU SOMMEIL
  =========================================== -->

  <aside class="sleep-data">

    <p>
      <span>SLEEP STAGE</span>
      <strong id="sleep-stage">WAKEFULNESS</strong>
    </p>

    <p>
      <span>AWARENESS</span>
      <strong id="awareness">100%</strong>
    </p>

    <p>
      <span>NEURAL ACTIVITY</span>
      <strong id="neural-status">BASELINE</strong>
    </p>

  </aside>


  <!-- ==========================================
       INDICATION DE SCROLL
  =========================================== -->

  <p
    class="scroll-instruction"
    id="scroll-instruction"
  >
    DESCEND INTO SLEEP
  </p>


  <div class="progress-line">

    <span id="progress-fill"></span>

  </div>


  <!-- Hauteur nécessaire au storytelling -->

  <main class="scroll-space"></main>


  <!-- Transition vers la prochaine page -->

  <div
    class="page-transition"
    aria-hidden="true"
  ></div>


  <!-- JavaScript de la page -->

  <script src="./sleep.js?v=41"></script>

</body>

</html>
