<!DOCTYPE html>

<html lang="en">

<head>

  <!-- ==========================================
       INFORMATIONS PRINCIPALES
  =========================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#02030b"
  >

  <meta
    name="description"
    content="The Sleeper — enter the Museum of Dreams."
  >

  <title>
    The Sleeper — Museum of Dreams
  </title>


  <!-- Polices -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Gloock&family=Italiana&display=swap"
    rel="stylesheet"
  >


  <!-- CSS réservé à cette page -->

  <link
  rel="stylesheet"
  href="./sleep.css?v=31"
>

</head>


<body class="sleeper-page">


  <!-- ==========================================
       CIEL ET PARTICULES
  =========================================== -->

  <div
    class="night-background"
    aria-hidden="true"
  >

    <div class="night-gradient"></div>

    <div class="night-nebula"></div>

    <div class="night-milky-way"></div>

    <canvas id="star-canvas"></canvas>

  </div>


  <!-- ==========================================
       SCULPTURE DU DORMEUR
  =========================================== -->

  <div
    class="face-stage"
    id="face-stage"
    aria-hidden="true"
  >

    <div class="face-aura"></div>


    <!-- Image 3D -->

    <!-- Visage avec les yeux ouverts -->

<img
  class="sleeper-image sleeper-open"
  src="./sleeper-open.png"
  alt=""
>


<!-- Même visage avec les yeux fermés -->

<img
  class="sleeper-image sleeper-closed"
  src="./sleeper-closed.png"
  alt=""
>


  <!-- ==========================================
       NAVIGATION
  =========================================== -->

  <header class="sleeper-header">

    <a href="index.html">
      THE MUSEUM OF DREAMS
    </a>


    <div class="sleeper-time">

      <span class="live-dot"></span>

      <span id="sleep-clock">
        23:47
      </span>

    </div>


    <a href="case-study.html">
      PROJECT
    </a>

  </header>


  <!-- ==========================================
       NARRATION UNIQUE

       Une seule zone est utilisée afin que
       les phrases ne se chevauchent jamais.
  =========================================== -->

  <div
    class="narration-area"
    id="narration-area"
  >

    <p
      class="narration"
      id="narration"
    >
      When night <em>has fallen…</em>
    </p>

  </div>


  <!-- ==========================================
       RÉVÉLATION FINALE
  =========================================== -->

  <div
    class="dream-revelation"
    id="dream-revelation"
  >

    <p class="creation-line">
      it creates…
    </p>

    <h1>
      DREAMS
    </h1>

    <p class="museum-status">
      THE MUSEUM IS NOW OPEN
    </p>

    <a
      href="brain.html"
      id="enter-mind"
      class="enter-mind"
    >
      ENTER THE MIND
    </a>

  </div>


  <!-- ==========================================
       DONNÉES DISCRÈTES
  =========================================== -->

  <aside class="sleep-monitor">

    <p>
      SLEEP STAGE
      <span id="sleep-stage">WAKEFULNESS</span>
    </p>

    <p>
      AWARENESS
      <span id="awareness-value">100%</span>
    </p>

    <p>
      NEURAL ACTIVITY
      <span id="neural-status">BASELINE</span>
    </p>

  </aside>


  <!-- ==========================================
       PROGRESSION DU SCROLL
  =========================================== -->

  <div class="scroll-progress">

    <span id="scroll-progress-fill"></span>

  </div>


  <p class="scroll-message">
    DESCEND INTO SLEEP
  </p>


  <!-- Espace créant la narration verticale -->

  <main class="sleep-scroll"></main>


  <!-- Transition vers le cerveau -->

  <div
    class="brain-transition"
    aria-hidden="true"
  ></div>


  <script src="./sleep.js?v=31"></script>

</body>

</html>
